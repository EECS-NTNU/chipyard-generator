name: Bug report
description: Report unexpected behavior in the Chipyard Generator sbt plugin or resolver.
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Share a minimal workspace declaration or say which fixture reproduces the issue. Include the sbt command you ran and whether offline mode was enabled.
      placeholder: Include the relevant settings from build.sbt and project/plugins.sbt.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error or the relevant excerpt from hardware.lock or plan.json. Redact credentials and private repository URLs.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version or repository commit
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Operating system, JDK, sbt, and Git versions
    validations:
      required: false
