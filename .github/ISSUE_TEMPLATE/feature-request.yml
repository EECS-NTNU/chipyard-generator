name: Feature request
description: Propose an improvement to Chipyard Generator.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your hardware workspace and where the current workflow gets in your way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show what you would like to declare in build.sbt, run from sbt, or see in the generated files.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: Describe how you handle this today, if applicable.
    validations:
      required: false
