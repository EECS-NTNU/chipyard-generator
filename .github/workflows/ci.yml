name: Chipyard Generator CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-checks:
    name: Resolver and workspace checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: step-security/setup-sbt@v1

      - name: Publish locally and run resolver checks
        run: |
          sbt -batch publishLocal \
            'resolver/Test/runMain chipyard.generator.ResolverChecks' \
            'resolver/Test/runMain chipyard.generator.SourceSelectionChecks' \
            'resolver/Test/runMain chipyard.generator.AliasNamespaceChecks'

      - name: Verify local and Git workspaces
        shell: bash
        run: |
          workspaces=$(mktemp -d)
          trap 'rm -rf -- "$workspaces"' EXIT
          export XDG_CACHE_HOME="$workspaces/cache"

          cp -R fixtures/local fixtures/git "$workspaces/"
          for fixture in local git; do
            (
              cd "$workspaces/$fixture"
              printf 'Resolves the %s workspace and reproduces its lockfile.\n' "$fixture"
              if [[ $fixture == git ]]; then ./prepare.sh; fi
              sbt -batch hardwareResolve
              cp hardware.lock "$workspaces/$fixture.expected-lock"
              sbt -batch hardwareResolve hardwareVerify
              cmp "$workspaces/$fixture.expected-lock" hardware.lock
              if [[ $fixture == git ]]; then
                printf '%s\n' 'Verifies the pinned Git workspace from the offline cache.'
                sbt -batch 'set hardwareOffline := true' hardwareVerify
                cmp "$workspaces/$fixture.expected-lock" hardware.lock
              fi
            )
          done

  hardware-acceptance:
    name: ${{ matrix.suite }} acceptance tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [rocket-reference, workspace-builds, source-selection, generator-aliases, generator-simulation, rtl-integration]
    env:
      ACCEPTANCE_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare the pinned Chipyard toolchain
        shell: bash
        run: |
          work="$RUNNER_TEMP/acceptance"
          mkdir -p "$work/artifacts" "$work/home" "$work/cache"
          {
            df -h "$RUNNER_TEMP" /var/lib/docker
            free -h
          } | tee "$work/artifacts/runner-resources.log"
          docker build --progress=plain --target acceptance-ci -t chipyard-acceptance-ci . \
            2>&1 | tee "$work/artifacts/toolchain-build.log"

      - name: Run hardware acceptance tests
        shell: bash
        run: |
          work="$RUNNER_TEMP/acceptance"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            --mount "type=bind,source=$work,target=/work" \
            chipyard-acceptance-ci bash "/repo/tests/acceptance/$ACCEPTANCE_SUITE.sh" \
            2>&1 | tee "$work/artifacts/acceptance.log"

      - name: Upload acceptance test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-results
          path: ${{ runner.temp }}/acceptance/artifacts/
          if-no-files-found: warn
